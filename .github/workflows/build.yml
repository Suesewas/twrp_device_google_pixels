name: build

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: FOX_BUILD_TYPE
        type: choice
        default: Stable
        options: [Stable, Beta]
      tag:
        description: build name tag (-n)
        type: string
        default: ci
      lgz_level:
        description: LGZ compression level (-l 0..3)
        type: choice
        default: '0'
        options: ['0', '1', '2', '3']
      device:
        description: device codename for touch modules
        type: string
        default: panther
      snapshot_upstream:
        description: push bootable/recovery + vendor/recovery into branch upstream-snapshot
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write
    steps:
      - name: Free disk space
        uses: rokibhasansagar/slimhub_actions@main

      - name: Swap space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 24

      - name: Android build environment
        run: |
          sudo apt-get update
          git clone --depth 1 https://gitlab.com/OrangeFox/misc/scripts ofox-scripts
          sudo bash ofox-scripts/setup/android_build_env.sh
          df -h /

      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          path: pixels
          fetch-depth: 1

      - name: ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ github.ref_name }}-
            ccache-

      - name: Sync OrangeFox 14.1
        timeout-minutes: 180
        shell: bash
        run: |
          set +e
          git config --global user.name "ci"
          git config --global user.email "ci@local"
          git config --global color.ui false
          git config --global http.lowSpeedLimit 1000
          git config --global http.lowSpeedTime 60
          git clone --depth 1 https://gitlab.com/OrangeFox/sync.git ofox-sync
          TREE="$GITHUB_WORKSPACE/fox_14.1"
          rc=1
          for i in 1 2 3 4 5; do
            echo "=== sync attempt $i ==="
            if [ -d "$TREE/.repo" ]; then
              cd "$TREE"
              timeout 35m repo sync -c --force-sync --no-clone-bundle --no-tags -j"$(nproc)"
              rc=$?
            else
              cd "$GITHUB_WORKSPACE/ofox-sync"
              timeout 35m ./orangefox_sync.sh --branch 14.1 --path "$TREE"
              rc=$?
            fi
            echo "=== attempt $i finished rc=$rc ==="
            df -h / | tail -1
            if [ "$rc" -eq 0 ]; then
              break
            fi
          done
          echo "=== sync done rc=$rc ==="
          ls -d "$TREE/bootable/recovery" "$TREE/vendor/recovery" "$TREE/build/envsetup.sh" 2>&1
          if [ "$rc" -ne 0 ]; then
            exit "$rc"
          fi

      - name: Place device tree
        run: |
          mkdir -p "$GITHUB_WORKSPACE/fox_14.1/device/google"
          rm -rf "$GITHUB_WORKSPACE/fox_14.1/device/google/pixels"
          mv "$GITHUB_WORKSPACE/pixels" "$GITHUB_WORKSPACE/fox_14.1/device/google/pixels"

      - name: Snapshot upstream sources
        if: ${{ inputs.snapshot_upstream }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "$GITHUB_WORKSPACE"
          rm -rf snap
          mkdir -p snap/bootable snap/vendor
          rsync -a --exclude '.git' fox_14.1/bootable/recovery/ snap/bootable/recovery/
          rsync -a --exclude '.git' fox_14.1/vendor/recovery/ snap/vendor/recovery/
          find snap -type f -size +95M -print -delete
          du -sh snap/bootable/recovery snap/vendor/recovery
          cd snap
          git init -q
          git checkout -qb upstream-snapshot
          git add -A
          git -c user.name=ci -c user.email=ci@local commit -qm "upstream snapshot $(date -u +%F)"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" upstream-snapshot
          cd "$GITHUB_WORKSPACE"
          rm -rf snap

      - name: Build
        run: |
          cd "$GITHUB_WORKSPACE/fox_14.1"
          export USE_CCACHE=1
          export CCACHE_DIR="$HOME/.ccache"
          export CCACHE_EXEC=$(command -v ccache)
          ccache -M 8G
          export ALLOW_MISSING_DEPENDENCIES=true
          ./device/google/pixels/build.sh \
            -n "${{ inputs.tag }}" \
            --build-type "${{ inputs.build_type }}" \
            -l "${{ inputs.lgz_level }}" \
            -j$(nproc)

      - name: Assemble vendor_boot.img
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEVICE: ${{ inputs.device }}
        run: |
          set +e
          cd "$GITHUB_WORKSPACE"
          mkdir -p artifacts
          TREE="$GITHUB_WORKSPACE/fox_14.1"
          PIXELS="$TREE/device/google/pixels"
          POUT="$TREE/out/target/product/pixels"
          LOG="$GITHUB_WORKSPACE/artifacts/assemble-step.log"
          exec > >(tee "$LOG") 2>&1

          echo "=== builds dir ==="
          ls -l "$TREE/builds" 2>&1
          echo "=== product out (img/zip/lz4) ==="
          find "$POUT" -maxdepth 1 \( -name 'OrangeFox-*' -o -name '*.lz4' -o -name '*.zip' \) -printf '%T@ %s %p\n' 2>&1 | sort -rn
          echo "=== tools ==="
          ls -l "$TREE/vendor/recovery/tools/magiskboot" "$TREE/vendor/recovery/tools/lz4" 2>&1
          ls -l "$PIXELS/installer/bin/linux/install-linux-x86_64" 2>&1

          echo "=== fetch stock base from branch assets ==="
          rm -rf base
          git clone --depth 1 --branch assets \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" base 2>&1 | tail -3
          BASE="$GITHUB_WORKSPACE/base/vendor_boot.img"
          ls -l "$BASE" 2>&1
          if [ ! -f "$BASE" ]; then
            echo "FATAL: stock base missing in branch assets"
            exit 1
          fi

          echo "=== locate payload ==="
          PAYLOAD="$(ls -t "$TREE"/builds/*.ramdisk.lz4 2>/dev/null | head -1)"
          if [ -z "$PAYLOAD" ]; then
            PAYLOAD="$(ls -t "$POUT"/*.ramdisk.lz4 2>/dev/null | head -1)"
          fi
          if [ -z "$PAYLOAD" ]; then
            echo "no ramdisk.lz4 from build.sh, extracting from image"
            IMG="$(ls -t "$POUT"/OrangeFox-*.img 2>/dev/null | head -1)"
            MB="$TREE/vendor/recovery/tools/magiskboot"
            LZ4="$TREE/vendor/recovery/tools/lz4"
            echo "img: $IMG"
            if [ -n "$IMG" ] && [ -x "$MB" ]; then
              rm -rf unpack && mkdir -p unpack
              ( cd unpack && "$MB" unpack "$IMG" ) 2>&1 | tail -5
              find unpack -maxdepth 2 -type f -printf '%s %p\n' 2>&1
              for f in unpack/vendor_ramdisk/ramdisk.cpio unpack/vendor_ramdisk_recovery.cpio unpack/ramdisk.cpio; do
                if [ -f "$f" ]; then
                  if [ -x "$LZ4" ]; then
                    "$LZ4" -l -9 -f "$f" artifacts/payload.ramdisk.lz4
                  else
                    lz4 -l -9 -f "$f" artifacts/payload.ramdisk.lz4
                  fi
                  PAYLOAD="$GITHUB_WORKSPACE/artifacts/payload.ramdisk.lz4"
                  break
                fi
              done
            fi
          fi
          echo "payload: $PAYLOAD"
          if [ -z "$PAYLOAD" ] || [ ! -f "$PAYLOAD" ]; then
            echo "FATAL: no recovery payload produced"
            exit 1
          fi
          ls -l "$PAYLOAD"
          cp -f "$PAYLOAD" artifacts/payload.ramdisk.lz4 2>/dev/null

          echo "=== assemble ==="
          INJECT=""
          [ -f "$PIXELS/installer/modules/${DEVICE}.lgz" ] && INJECT="--inject-lgz $PIXELS/installer/modules/${DEVICE}.lgz"
          chmod +x "$PIXELS/installer/bin/linux/install-linux-x86_64" 2>/dev/null
          "$PIXELS/installer/bin/linux/install-linux-x86_64" install --file \
            -i "$BASE" -c "$PAYLOAD" -o artifacts/vendor_boot.img \
            --device "$DEVICE" $INJECT \
            --partition-size 67108864 --min-free-mb 7 --log artifacts/assemble.log
          rc=$?
          echo "installer rc=$rc"
          ls -l artifacts/ 2>&1
          [ -f artifacts/vendor_boot.img ] && sha256sum artifacts/vendor_boot.img | tee artifacts/vendor_boot.sha256
          exit "$rc"

      - name: Publish payload and logs to branch ci-logs
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          cd "$GITHUB_WORKSPACE"
          rm -rf cilogs && mkdir -p cilogs
          cp -f artifacts/*.log artifacts/*.sha256 cilogs/ 2>/dev/null
          cp -f artifacts/payload.ramdisk.lz4 cilogs/ 2>/dev/null
          find "$GITHUB_WORKSPACE/fox_14.1/builds" "$GITHUB_WORKSPACE/fox_14.1/out/target/product/pixels" \
            -maxdepth 1 -printf '%s %p\n' > cilogs/manifest.txt 2>&1
          find cilogs -type f -size +90M -print -delete
          cd cilogs
          git init -q
          git checkout -qb ci-logs
          git add -A
          git -c user.name=ci -c user.email=ci@local commit -qm "run ${GITHUB_RUN_ID}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-logs 2>&1 | tail -2

      - name: Disk and ccache stats
        if: always()
        run: |
          df -h /
          ccache -s || true

      - name: Collect artifacts
        if: always()
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          cp -f "$GITHUB_WORKSPACE"/fox_14.1/builds/* "$GITHUB_WORKSPACE/artifacts/" 2>/dev/null || true
          cp -f "$GITHUB_WORKSPACE"/fox_14.1/out/target/product/pixels/OrangeFox*.img "$GITHUB_WORKSPACE/artifacts/" 2>/dev/null || true
          cp -f "$GITHUB_WORKSPACE"/fox_14.1/out/target/product/pixels/*.ramdisk.lz4 "$GITHUB_WORKSPACE/artifacts/" 2>/dev/null || true
          ls -l "$GITHUB_WORKSPACE/artifacts" || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recovery-${{ inputs.tag }}-${{ inputs.build_type }}
          path: artifacts/*
          if-no-files-found: warn
          retention-days: 14
