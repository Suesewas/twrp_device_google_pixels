name: attest-probe

on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out KeyAttestation
        uses: actions/checkout@v4
        with:
          repository: vvb2060/KeyAttestation
          ref: master
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          echo 'org.gradle.jvmargs=-Xmx3072m' >> gradle.properties
          ./gradlew assembleDebug --no-daemon

      - name: Collect
        run: |
          mkdir -p out
          find app/build/outputs -name '*.apk' -print -exec cp {} out/ \;
          ls -l out

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: keyattestation-apk
          path: out/*.apk
          if-no-files-found: error
          retention-days: 14
